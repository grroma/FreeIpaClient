name: publish to nuget

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: build, test, pack and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: resolve package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' must look like v10.0.0 or v10.0.0-rc"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: restore
        run: dotnet restore src/FreeIpaClient.sln

      - name: build
        run: >
          dotnet build src/FreeIpaClient.sln
          --configuration Release
          --no-restore
          /p:Version=${{ steps.version.outputs.value }}
          /p:PackageVersion=${{ steps.version.outputs.value }}

      - name: test
        run: dotnet test src/FreeIpaClient.Tests/FreeIpaClient.Tests.csproj --configuration Release --no-build --filter "Category!=Integration"

      - name: pack
        run: >
          dotnet pack src/FreeIpaClient/FreeIpaClient.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          /p:Version=${{ steps.version.outputs.value }}
          /p:PackageVersion=${{ steps.version.outputs.value }}

      - name: publish
        run: >
          dotnet nuget push "artifacts/packages/FreeIpaClient.${{ steps.version.outputs.value }}.nupkg"
          --api-key "${{ secrets.NUGET_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
